name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Read version and check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "::error::Release tag ${tag} already exists. Bump package.json version before pushing to main."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact-name: windows-installer
            artifact-path: dist/*.exe
            build-command: npx electron-builder --win nsis --x64 --publish never
          - name: macOS Apple Silicon
            os: macos-latest
            artifact-name: macos-installer
            artifact-path: dist/*.dmg
            build-command: npx electron-builder --mac dmg --arm64 --publish never
          - name: Linux x64
            os: ubuntu-latest
            artifact-name: linux-installer
            artifact-path: dist/*.AppImage
            build-command: npx electron-builder --linux AppImage --x64 --publish never
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:next

      - name: Build Electron main process
        run: npm run build:electron

      - name: Prepare distribution workaround
        run: npm run predist

      - name: Confirm runner architecture
        shell: bash
        run: |
          uname -a
          node -p "process.platform + ' ' + process.arch"

      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'false' || '' }}
        run: ${{ matrix.build-command }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create tag
        shell: bash
        run: |
          git tag "${{ needs.preflight.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ needs.preflight.outputs.tag }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ needs.preflight.outputs.tag }}" release-assets/* \
            --title "${{ needs.preflight.outputs.tag }}" \
            --notes "Automated release for Storybook Packager ${{ needs.preflight.outputs.version }}.

          Builds are unsigned on all platforms.

          Windows may show a SmartScreen warning because the installer is not code-signed.
          macOS may block first launch until you allow Storybook Packager from Privacy & Security.
          Linux users should make the AppImage executable before running it."
